name: Release Plan Tests

on:
  workflow_call:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    name: test ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: verify release publishing safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path(".github/workflows/release.yml").read_text().splitlines()

          def parse_mapping(start, child_indent):
              values = {}
              prefix = " " * child_indent
              for line in lines[start + 1:]:
                  if line and not line.startswith(prefix):
                      break
                  if not line.strip():
                      continue
                  match = re.fullmatch(
                      rf"{prefix}\"?([A-Za-z0-9_-]+)\"?: \"?([A-Za-z0-9_-]+)\"?",
                      line,
                  )
                  if match:
                      values[match.group(1)] = match.group(2)
              return values

          top_level_permissions = [
              i for i, line in enumerate(lines) if line == "permissions:"
          ]
          if not top_level_permissions:
              raise SystemExit("release workflow must default contents permission to read")
          if parse_mapping(top_level_permissions[0], 2).get("contents") != "read":
              raise SystemExit("release workflow default contents permission must be read")

          job_ranges = []
          for i, line in enumerate(lines):
              match = re.fullmatch(r"  ([A-Za-z0-9_-]+):", line)
              if match:
                  job_ranges.append([match.group(1), i, len(lines)])
          for current, next_job in zip(job_ranges, job_ranges[1:]):
              current[2] = next_job[1]

          write_jobs = []
          broad_write_jobs = []
          for name, start, end in job_ranges:
              for offset, line in enumerate(lines[start:end]):
                  scalar = re.fullmatch(r"    permissions: \"?([A-Za-z0-9_-]+)\"?", line)
                  if scalar and scalar.group(1) in {"write", "write-all"}:
                      broad_write_jobs.append(name)
                  if line == "    permissions:":
                      if parse_mapping(start + offset, 6).get("contents") == "write":
                          write_jobs.append(name)

          if broad_write_jobs:
              raise SystemExit(
                  f"release workflow jobs must not request broad write permissions: {broad_write_jobs}"
              )
          if write_jobs != ["host"]:
              raise SystemExit(
                  f"expected only the host job to request contents: write, got {write_jobs}"
              )
          # dist does not generate the local test gate. Catch either half
          # going missing when the generated workflow is refreshed.
          _, start, end = next(job for job in job_ranges if job[0] == "host")
          host_job = lines[start:end]
          needs_start = host_job.index("    needs:")
          needs = []
          for line in host_job[needs_start + 1:]:
              if not line.startswith("      - "):
                  break
              needs.append(line.removeprefix("      - "))
          if "custom-release-plan-tests" not in needs:
              raise SystemExit("release host job must depend directly on release tests")
          condition = next(line for line in host_job if line.startswith("    if:"))
          # Split after the opening braces without placing the Actions
          # expression marker inside this run step.
          condition = condition.partition("{{")[2].removesuffix("}}")
          # Artifact statuses use parenthesized alternatives. The test guard
          # must be a required term of the outer conjunction.
          outer = re.sub(r"\([^()]*\)", "", condition)
          terms = [term.strip() for term in outer.split("&&")]
          if "||" in outer or "needs.custom-release-plan-tests.result == 'success'" not in terms:
              raise SystemExit("release host job must require release tests to succeed")

          # dist regeneration can drop the deployment target and archive check.
          _, start, end = next(job for job in job_ranges if job[0] == "build-local-artifacts")
          build_job = lines[start:end]
          if '      MACOSX_DEPLOYMENT_TARGET: "13.0"' not in build_job:
              raise SystemExit("local artifact builds must declare macOS 13.0 as the deployment target")
          if "      - name: Verify macOS archives" not in build_job:
              raise SystemExit("local artifact builds must verify the deployment target in macOS archives")
          PY
      - name: cargo test --locked
        run: cargo test --locked --all-features --all-targets

  test-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    name: test macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test --locked
        run: cargo test --locked --all-features --all-targets
