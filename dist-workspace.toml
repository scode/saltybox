[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# The generated workflow is intentionally patched after generation to keep PR
# runs on read-only repository permissions while preserving tag-publish access.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app. Homebrew is deliberately absent:
# the formula is pulled and reviewed in scode/homebrew-dist-tap from the
# published release archives, not pushed from this workflow.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
# Plan jobs to run in CI
plan-jobs = ["./release-plan-tests"]

# Commit SHAs for the actions dist writes into release.yml, so regenerating the
# workflow keeps them pinned as SPEC.md (Build integrity) requires. dist copies
# each value verbatim after the `@`, so the ` # vX.Y.Z` suffix is deliberate: it
# becomes the trailing version comment on every generated `uses:` line.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0"
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0"
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0"
